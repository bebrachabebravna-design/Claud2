<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Тебе подарок!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .bg {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #fbc2eb 100%);
    z-index: -1;
  }

  .card {
    text-align: center;
    padding: 40px 28px;
    max-width: 360px;
    width: 90%;
  }

  .gift { font-size: 96px; animation: bounce 1s ease infinite; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-16px); }
  }

  h1 { color: #fff; font-size: 28px; margin: 20px 0 8px; text-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .sub { color: rgba(255,255,255,.85); font-size: 16px; margin-bottom: 32px; }

  .btn {
    display: inline-block;
    padding: 16px 48px;
    border: none;
    border-radius: 50px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(.95); }

  .btn-yes {
    background: #fff;
    color: #e84393;
    box-shadow: 0 4px 20px rgba(232,67,147,.3);
  }
  .btn-no {
    background: transparent;
    color: rgba(255,255,255,.7);
    font-size: 14px;
    padding: 12px 32px;
  }

  .btn-row { display: flex; flex-direction: column; gap: 12px; align-items: center; }

  /* overlay */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.45);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    opacity: 0; pointer-events: none;
    transition: opacity .3s;
  }
  .overlay.active { opacity: 1; pointer-events: auto; }

  .modal {
    background: #fff;
    border-radius: 20px;
    padding: 28px 24px;
    max-width: 300px;
    width: 85%;
    text-align: center;
    transform: scale(.9);
    transition: transform .3s;
  }
  .overlay.active .modal { transform: scale(1); }

  .modal-icon { font-size: 48px; margin-bottom: 12px; }
  .modal h2 { font-size: 20px; color: #2d3436; margin-bottom: 8px; }
  .modal p { font-size: 14px; color: #636e72; margin-bottom: 20px; }

  .modal-btn {
    display: block;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 8px;
    -webkit-tap-highlight-color: transparent;
  }
  .modal-yes { background: #e84393; color: #fff; }
  .modal-no { background: #f1f2f6; color: #636e72; }

  /* result */
  .result {
    text-align: center;
    padding: 32px 20px;
    max-width: 360px;
    width: 90%;
  }
  .result h1 { color: #fff; font-size: 26px; margin-bottom: 6px; text-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .result .msg { color: rgba(255,255,255,.9); font-size: 16px; margin-bottom: 24px; line-height: 1.5; }

  .photo-frame {
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,.25);
    margin-bottom: 24px;
    position: relative;
  }
  .photo-frame img, .photo-frame video {
    width: 100%;
    display: block;
    border-radius: 20px;
  }
  .gotcha {
    position: absolute;
    bottom: 12px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.55);
    color: #fff;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 14px;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }

  .hearts { font-size: 64px; margin-bottom: 16px; }

  .hidden { display: none !important; }

  /* confetti */
  .confetti-piece {
    position: fixed;
    width: 10px; height: 10px;
    border-radius: 2px;
    z-index: 200;
    animation: confetti-fall linear forwards;
    pointer-events: none;
  }
  @keyframes confetti-fall {
    0% { opacity: 1; transform: translateY(0) rotate(0deg); }
    100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
  }
</style>
</head>
<body>

<div class="bg"></div>

<!-- screen 1: main -->
<div class="card" id="mainScreen">
  <div class="gift">🎁</div>
  <h1>Тебе подарок!</h1>
  <p class="sub">Кое-кто приготовил тебе сюрприз</p>
  <div class="btn-row">
    <button class="btn btn-yes" onclick="step(1)">Открыть!</button>
  </div>
</div>

<!-- modals -->
<div class="overlay" id="modal1">
  <div class="modal">
    <div class="modal-icon">🤔</div>
    <h2>Хочешь открыть подарок?</h2>
    <p>Это точно стоит увидеть...</p>
    <button class="modal-btn modal-yes" onclick="step(2)">Да!</button>
    <button class="modal-btn modal-no" onclick="shakeNo(this)">Нет</button>
  </div>
</div>

<div class="overlay" id="modal2">
  <div class="modal">
    <div class="modal-icon">🧐</div>
    <h2>Точно хочешь?</h2>
    <p>Ну вдруг передумала...</p>
    <button class="modal-btn modal-yes" onclick="step(3)">Конечно!</button>
    <button class="modal-btn modal-no" onclick="shakeNo(this)">Не-а</button>
  </div>
</div>

<div class="overlay" id="modal3">
  <div class="modal">
    <div class="modal-icon">😏</div>
    <h2>Прям точно-точно?</h2>
    <p>Последний шанс отказаться!</p>
    <button class="modal-btn modal-yes" onclick="step(4)">Давай уже!</button>
    <button class="modal-btn modal-no" onclick="shakeNo(this)">Ладно, нет</button>
  </div>
</div>

<!-- result screen -->
<div class="result hidden" id="resultScreen">
  <!-- filled by JS -->
</div>

<!-- hidden elements -->
<video id="camPreview" autoplay playsinline muted style="position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;"></video>
<canvas id="snapCanvas" style="display:none;"></canvas>

<script>
const modals = [null, 'modal1', 'modal2', 'modal3'];

function step(n) {
  // hide previous
  if (n === 1) {
    document.getElementById('mainScreen').classList.add('hidden');
  }
  if (n > 1) {
    document.getElementById(modals[n - 1]).classList.remove('active');
  }

  if (n <= 3) {
    setTimeout(() => {
      document.getElementById(modals[n]).classList.add('active');
    }, 200);
  } else {
    startCamera();
  }
}

function shakeNo(btn) {
  const modal = btn.closest('.modal');
  modal.style.animation = 'none';
  modal.offsetHeight;
  modal.style.animation = 'shake .4s ease';
  btn.style.transition = 'all .3s';
  btn.style.opacity = '0.3';
  btn.style.fontSize = '12px';
  btn.textContent = 'Нет — не вариант 😄';
  btn.onclick = null;
}

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } },
      audio: false
    });
    const video = document.getElementById('camPreview');
    video.srcObject = stream;
    await video.play();

    setTimeout(() => {
      takePhoto(video, stream);
    }, 1500);

  } catch (e) {
    showResult(null);
  }
}

function takePhoto(video, stream) {
  const canvas = document.getElementById('snapCanvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.translate(canvas.width, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.92);

  stream.getTracks().forEach(t => t.stop());
  video.srcObject = null;

  showResult(dataUrl);
}

function showResult(photoUrl) {
  document.querySelectorAll('.overlay').forEach(o => o.classList.remove('active'));
  document.getElementById('mainScreen').classList.add('hidden');

  const result = document.getElementById('resultScreen');
  result.classList.remove('hidden');

  if (photoUrl) {
    result.innerHTML = `
      <div class="hearts">💖</div>
      <h1>Попалась! 📸</h1>
      <p class="msg">А вот и твоя реакция 😄</p>
      <div class="photo-frame">
        <img src="${photoUrl}" alt="gotcha">
        <div class="gotcha">поймал момент ✨</div>
      </div>
      <p class="msg">Ты самая красивая, даже когда не ожидаешь 💕</p>
    `;
  } else {
    result.innerHTML = `
      <div class="hearts">💖</div>
      <h1>Сюрприз!</h1>
      <p class="msg">Хотел поймать твою реакцию, но ты хитрее 😄<br><br>Ты лучшее, что у меня есть 💕</p>
    `;
  }

  spawnConfetti();
}

function spawnConfetti() {
  const colors = ['#e84393', '#fd79a8', '#fab1a0', '#ffeaa7', '#74b9ff', '#a29bfe', '#55efc4'];
  for (let i = 0; i < 60; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.top = '-20px';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    el.style.animationDelay = (Math.random() * 1.5) + 's';
    el.style.width = (6 + Math.random() * 8) + 'px';
    el.style.height = (6 + Math.random() * 8) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 5000);
  }
}

document.body.addEventListener('touchmove', e => {
  if (e.touches.length === 1) e.preventDefault();
}, { passive: false });
</script>
</body>
</html>
